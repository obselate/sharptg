name: release

on:
  push:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            platform: linux/amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          path: sharptg
      - uses: actions/checkout@v4
        with:
          repository: obselate/sharptui
          path: sharptui
      - uses: docker/setup-qemu-action@v3
        if: matrix.platform != 'linux/amd64' && matrix.runner == 'ubuntu-latest'
      - uses: docker/setup-buildx-action@v3
      - name: Build static musl binary
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$PWD":/work \
            -w /work/sharptg \
            -e "SHARPTG_DIST_NAME=sharptg-${{ matrix.name }}" \
            mcr.microsoft.com/dotnet/sdk:10.0-alpine3.23-aot \
            sh scripts/ci-build-musl.sh
          sudo chown -R "$(id -u):$(id -g)" sharptg/dist sharptg/build-ci
      - name: Package
        working-directory: sharptg/dist
        run: sha256sum "sharptg-${{ matrix.name }}" > "sharptg-${{ matrix.name }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: sharptg-${{ matrix.name }}
          path: |
            sharptg/dist/sharptg-${{ matrix.name }}
            sharptg/dist/sharptg-${{ matrix.name }}.sha256
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macos-arm64
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: sharptg
      - uses: actions/checkout@v4
        with:
          repository: obselate/sharptui
          path: sharptui
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        working-directory: sharptg
        run: scripts/ci-build-macos.sh
      - name: Package
        working-directory: sharptg/dist
        run: shasum -a 256 sharptg-macos-arm64.tar.gz > sharptg-macos-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sharptg-macos-arm64
          path: |
            sharptg/dist/sharptg-macos-arm64.tar.gz
            sharptg/dist/sharptg-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Verify artifacts
        run: |
          test -f release/sharptg-linux-x86_64
          test -f release/sharptg-linux-arm64
          test -f release/sharptg-macos-arm64.tar.gz
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: build-${{ github.sha }}
          body: Automated build of `${{ github.sha }}` on `${{ github.ref_name }}`.
          files: release/*
